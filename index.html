  <!--  Critical inline CSS: paints the correct background instantly, before the
    JS bundle or external CSS has loaded. This is what actually kills the
    white-flash-on-reload - nothing in React/localStorage can fix a flash
    that happens before React mounts.  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("readmade:theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.style.colorScheme = "light";
        }
      } catch (e) {}
    })();
  </script>

    html.dark,
    html.dark body,
    html.dark #root {
